spring.config.import=optional:file:.env[.properties]

# Database configuration - Supabase PostgreSQL (Connection Pooler - Session Mode)
# Override with environment variables: JDBC_URL, DB_USER, DB_PASSWORD
# Default Supabase connection pooler (project: elapmouaiondwnzmthlj, region: us-west-2)
# Set DB_PASSWORD environment variable with your Supabase database password
spring.datasource.url=${JDBC_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.elapmouaiondwnzmthlj}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# H2 Console disabled (using PostgreSQL)
spring.h2.console.enabled=false
